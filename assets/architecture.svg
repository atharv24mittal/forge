  <text x="450" y="36" text-anchor="middle" font-family="'Exo 2', sans-serif" font-size="22" font-weight="900" fill="#FF6B35" letter-spacing="6" filter="url(#glow-sm)">FORGE</text>
  <text x="450" y="54" text-anchor="middle" font-family="monospace" font-size="10" fill="#4A5468" letter-spacing="3">AUTONOMOUS AI SOFTWARE FACTORY · AGENT SWARMS THEME</text>

